model:
  default: mercury-3
  provider: custom
  base_url: https://api.inceptionlabs.ai/v1
  context_length: 1048576
  api_key: ''
fallback_providers: []
database:
  journal_mode: wal
runtime:
  nofile_soft_limit: 4096
agent:
  max_turns: 150
  reasoning_overrides:
    moonshotai/kimi-k3: ''
  reasoning_effort: xhigh
  verbose: false
terminal:
  backend: local
  cwd: .
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
web:
  backend: exa
  provider_tier:
    exa: paid
browser:
  inactivity_timeout: 120
  cloud_provider: local
checkpoints:
  enabled: true
tool_output:
  max_bytes: 75000
  max_lines: 5000
tool_loop_guardrails:
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
  warnings_# enabled: true
  hard_stop_# enabled: true
compression:
  enabled: true
  progress_notices: true
  threshold: 0.8
  target_ratio: 0.3
  protect_last_n: 30
  min_tail_user_messages: 1
  max_attempts: 3
  proactive_prune_tokens: 0
  proactive_prune_min_result_chars: 8000
  proactive_prune_min_reclaim_tokens: 4096
  protect_first_n: 3
  codex_gpt55_autoraise: true
  codex_app_server_auto: native
  codex_responses_native: false
  codex_responses_compact_threshold: 200000
  idle_compact_after_seconds: 0
prompt_caching:
  cache_ttl: 5m
auxiliary:
  vision:
    provider: custom:xkiro
    model: qwen/qwen3.5-omni-plus:free
    key_env: ''
    fallback_chain:
    - provider: custom:xkiro
      model: qwen/qwen3.8-max:free
      base_url: ''
      key_env: ''
    - provider: nvidia
      model: meta/llama-3.2-11b-vision-instruct
      base_url: ''
      key_env: NVIDIA_API_KEY
  compression:
    provider: auto
    model: ''
  skills_hub:
    provider: auto
    model: ''
  approval:
    provider: auto
    model: ''
  mcp:
    provider: auto
    model: ''
  title_generation:
    provider: nvidia
    model: nvidia/nemotron-3-ultra-550b-a55b
    reasoning_effort: none
  memory_query_rewrite:
    provider: auto
    model: ''
  tts_audio_tags:
    provider: nvidia
    model: google/gemma-4-31b-it
  triage_specifier:
    provider: auto
    model: ''
  kanban_decomposer:
    provider: auto
    model: ''
  profile_describer:
    provider: auto
    model: ''
  curator:
    provider: auto
    model: ''
  moa_reference:
    provider: custom
    model: moonshotai/kimi-k2.6
    base_url: https://api.zydit.in/v1
    key_env: HERMES_CUSTOM_API_ZYDIT_IN_API_KEY
  moa_aggregator:
    provider: nvidia
    model: nvidia/nemotron-3-ultra-550b-a55b
    base_url: https://integrate.api.nvidia.com/v1
  web_extract:
    provider: auto
    model: ''
display:
  compact: true
  busy_input_mode: interrupt
  bell_on_complete: true
  show_reasoning: true
  background_process_notifications: result
  streaming: true
  battery: true
  skin: default
  interim_assistant_messages: true
  pet:
    enabled: false
    slug: homelander
  tool_progress: all
  cleanup_progress: false
  long_running_notifications: true
  busy_ack_detail: true
  tui_statusbar: top
tts:
  provider: edge
voice:
  voice_chat_mode: gpt-live
memory:
  memory_char_limit: 3500
  user_char_limit: 2000
  nudge_interval: 10
  memory_# enabled: true
  user_profile_# enabled: true
delegation:
  model: mercury-3
  provider: custom:inception-mecury-v1
  base_url: ''
  api_key: ''
  max_iterations: 250
  max_concurrent_children: 5
  max_spawn_depth: 2
moa:
  presets:
    default:
      reference_models:
      - provider: nvidia
        model: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
      - provider: nvidia
        model: google/gemma-4-31b-it
      - provider: nvidia
        model: nvidia/nemotron-3-super-120b-a12b
      aggregator:
        provider: nvidia
        model: nvidia/nemotron-3-ultra-550b-a55b
      degraded_reference_policy: loud
      fanout: user_turn
  reference_models:
  - provider: nvidia
    model: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
  - provider: nvidia
    model: google/gemma-4-31b-it
  - provider: nvidia
    model: nvidia/nemotron-3-super-120b-a12b
  aggregator:
    provider: nvidia
    model: nvidia/nemotron-3-ultra-550b-a55b
  degraded_reference_policy: loud
  fanout: user_turn
  enabled: true
skills:
  auto_load:
  - provider-registry
  - craftedworkflows-coo
  - termux-safety
  creation_nudge_interval: 15
  disabled:
  - airtable
  - ascii-video
  - baoyu-infographic
  - box
